# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "analytic-number-theory-lean (NTKB): analytic number theory"
  description: >-
    A Lean 4 + Mathlib formalization of two texts of analytic number theory, item by item: Apostol's Introduction to
    Analytic Number Theory and Davenport's Multiplicative Number Theory (2nd edition, revised by H. L. Montgomery).
    Principal results: the Hadamard product for xi(s, chi); the zero-free region for Dirichlet L-functions with
    Landau's and Page's theorems on exceptional zeros; the Riemann-von Mangoldt formula for N(T) and its analogue
    for N(T, chi); the explicit formula for psi(x, chi); the prime number theorem for arithmetic progressions with
    the classical error term (outside the multiples of one exceptional modulus); the Polya-Vinogradov inequality;
    the large sieve and its form for characters; Vinogradov's estimate for exponential sums over primes; Siegel's
    theorem (both forms) and the Siegel-Walfisz theorem (for psi and pi); the Bombieri-Vinogradov and
    Barban-Davenport-Halberstam theorems, unconditionally (since 0.2.0); Vinogradov's asymptotic formula for the
    number of representations as a sum of three primes and the three primes theorem (since 0.3.0); the finite class
    number formulas, Jacobi's class number formula and Siegel's lower bounds for class numbers (since 0.3.0,
    unconditional since 0.4.0); the basic theorem on the representations by binary quadratic forms (since 0.4.0);
    the Riemann-von Mangoldt formula with 7/8 + S(T) + O(1/T) and von Mangoldt's explicit formula for real x >= 2
    (since 0.4.0) and for every real x > 1 (since 0.4.1); the primary representations of Davenport's Chapter 6 (since 0.4.1); since 0.5.0, von Mangoldt's formula in
    Riemann's form, the truncated explicit formula for psi(x, chi), the effective bound for a real zero, the prime
    number theorem for arithmetic progressions with the exceptional zero, Hecke's class number bound under a
    zero-free interval, Montgomery's large sieve (with the Brun-Titchmarsh inequality, not a headline); Polya's
    inequality, the bound p(n) < exp(pi sqrt(2n/3)) and the mean square of a Dirichlet series (Apostol). Each result
    of the books is mapped to its Lean declaration and status in docs/results/books/, which also credits the results
    proved here that Mathlib, Tau Ceti or PrimeNumberTheoremAnd also prove.
  authors:
    - "Jonathan Hanke"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Jonathan Hanke"

classification:
  arxiv: ["math.NT"]
  # 11M06 zeta and L-functions; 11M26 nonreal zeros of zeta and L-functions; 11N05 distribution of primes;
  # 11N13 primes in progressions; 11N35 sieves; 11L07 exponential sums; 11L40 character sums; 11P82 partitions;
  # 11P32 Goldbach-type theorems (three primes); 11R11 quadratic extensions; 11R29 class numbers; 11E16 binary
  # quadratic forms; 11F27 theta series; 30D20 entire functions; 03B35 mechanization of proofs and logical operations.
  msc2020: ["11M06", "11M26", "11N05", "11N13", "11N35", "11L07", "11L40", "11P32", "11P82", "11R11", "11R29", "11E16", "11F27", "30D20", "03B35"]

sources:
  - title: "Multiplicative Number Theory (2nd edition)"
    authors:
      - "Harold Davenport"
    type: "book"
    location: "Springer, Graduate Texts in Mathematics 74, 1980 (revised by H. L. Montgomery); every result mapped in docs/results/books/davenport.md"
    relationship: "formalizes"
    author_endorsement: "n/a"
  - title: "Introduction to Analytic Number Theory"
    authors:
      - "Tom M. Apostol"
    type: "book"
    location: "Springer, Undergraduate Texts in Mathematics, 1976; every result mapped in docs/results/books/apostol.md"
    relationship: "formalizes"
    author_endorsement: "n/a"
  - title: "Further references"
    type: "bibliography"
    location: "references.bib in this repository; each result is tagged with @[kb \"<key>\" \"<locator>\"]"
    relationship: "background"

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4"
    relationship: "builds-on"
    note: "Built on Mathlib at commit 1b1ccf4. docs/results/comparison.md says what each headline adds to Mathlib master (4cf60f1d, 2026-11-14; the headlines new in 0.4.0 against a8754b1, 2026-11-16; the one new in 0.4.1 against d9a73ae1, 2026-11-17; those new in 0.5.0 against 5198cccb, 2026-11-18)."
  - id: "https://github.com/jonhanke/elementary-number-theory-lean"
    relationship: "related"
    note: "Not a dependency (both use the module namespace NTKB): 117 files of its v0.5.0 (same Lean and Mathlib) are shipped here unchanged: the attribute file, the special values of Dirichlet L-functions and part of the Apostol files."
  - id: "https://github.com/TauCetiProject/TauCeti"
    relationship: "related"
    note: >-
      Not a dependency. Some code is ported from Tau Ceti with credit (NTKB/Port/ and lemmas of NTKB/Elementary/SpecialValues/). docs/results/comparison.md
      compares each headline with Tau Ceti main (9f43ade0, 2026-11-15; the headlines new in 0.4.0 with 726e93ef,
      2026-11-16; the one new in 0.4.1 with 7b4d5f70, 2026-11-17; those new in 0.5.0 with 6532c340, 2026-11-18).
  - id: "https://github.com/AlexKontorovich/PrimeNumberTheoremAnd"
    relationship: "related"
    note: >-
      Not a dependency. It proves the prime number theorem with the classical error term, a zero-free region for
      zeta, Hadamard's factorization theorem and the product for xi(s), and the bound 1/|zeta(s)| << log^7 t in the
      region sigma >= 1 - A/log^9 t (Apostol's Theorem 13.10); this library proves these too (not headlines) and
      adds the L-function results.

status:
  scope: >-
    Release 0.5.0. Formalized (the 48 statements of the Challenge_<book>.lean files, proved in the
    Solution_<book>.lean files): Davenport 45 (Chapters 6, 8, 12, 14, 15, 16, 17, 19, 20, 21, 22, 23, 25, 26, 27, 28
    and 29), Apostol 3 (Theorems 8.21, 11.16, 14.5). The book maps give the status of every result. Five headlines of
    0.3.0 (the class number statements of Davenport Chapters 6 and 21) take two named inputs as hypotheses,
    NTKB.Davenport.QuadraticFieldDiscriminants and NTKB.Davenport.QuadraticIdealCount; since 0.4.0 both are proved
    (NTKB.Davenport.quadraticFieldDiscriminants, NTKB.Davenport.quadraticIdealCount) and five headlines state the
    same results without them. One form of Apostol's Theorem 11.14 (not a headline) takes the named input
    NTKB.Apostol.DirichletInverseSummableInput. SiegelWalfiszHypothesis, the input of Bombieri's theorem and of the
    Barban-Davenport-Halberstam theorem in 0.1.0, is proved since 0.2.0. Results under the generalized Riemann
    hypothesis take it as a named hypothesis and are not headlines. Von Mangoldt's explicit formula is proved for
    every real x > 1, as in the book (since 0.4.1; the headline of 0.4.0 has x >= 2). Hecke's class number bound
    (since 0.5.0) is an implication from a zero-free interval of L(s, chi_d), a hypothesis of the theorem, not a
    named input.
  sorry_count: 0
  sorry_in_definitions: 0
  # No custom axioms; the standard axioms used (checked by scripts/check_axioms.lean and lake comparator):
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5", "Claude Sonnet 5.5"]
      framework: "Claude Code"
      tool_setup: >-
        Claude Code orchestrating parallel agents, each in its own git branch, with Lean kernel builds (lake build)
        as the check and pull requests merged into the main branch; human direction throughout.
      prompting_notes: >-
        Human-chosen books and results; agents worked item by item from coverage tables of each book, with
        written notes passed between sessions. Cited results that are not proved are named Lean structures, never
        assumed silently; a kernel-level audit decides which are proved.
  notes: >-
    Jonathan Hanke designed and directed the project; the Lean code was written almost entirely by Claude Opus 5.5,
    with a share by Claude Sonnet 5.5, in November 2026 (releases 0.4.0 to 0.5.0: November 2026). All proofs are checked by the Lean kernel; the headline
    statements are collected in the Challenge_<book>.lean files for human review.

fidelity:
  divergences: >-
    (1) Davenport's absolute constants are made explicit where the library has them (zero-free region c = 1/16200
    for L-functions, Landau c = 1/400, Page c = 1/800); they are not the best possible. (2) The explicit formulas are
    proved at integers N >= 3, with psi_0(N, chi) = sum over n < N of chi(n) Lambda(n) plus half the term at N; the
    sum over zeros is the limit of the sums over |gamma| < T. (3) The prime number theorem for progressions is the
    form after Page's theorem (Davenport, Chapter 20, (13)) for integers N >= 3, with the exceptional modulus
    explicit. (4) The Polya-Vinogradov inequality has the constant 2 (sqrt q log q times 2) for every nonprincipal
    character; Polya's inequality (Apostol) is for primitive characters with constant 1. (5) N(T, chi) counts the
    zeros with |gamma| < T. (6) Siegel's theorem is stated for the real part of L(1, chi) (which is real); its
    constants, and those of the Siegel-Walfisz theorem, are not effective, as in the book. Estermann's inequality
    (Davenport (8)) is proved with an absolute constant c in the exponent in place of 8, which suffices. The
    Siegel-Walfisz theorem for pi(x; q, a) has the error x exp(-c sqrt(log x)), the book's saving of log x being
    absorbed by a change of c. Bombieri's theorem expresses the maxima over y <= x and over a by arbitrary choices
    y(q), a(q). (7) The book maps' one-line statements are paraphrases; Davenport's results are numbered
    chapter-k in the order of the text, since the book does not number them. (8) The class number formulas and
    Siegel's class number bounds (since 0.3.0) are stated for the class number and the regulator of the quadratic
    field (the regulator is log epsilon for a fundamental unit epsilon of either norm), not for Davenport's class
    number of binary forms with epsilon of norm +1; they agree when the fundamental unit has norm +1. Jacobi's
    formula is stated as q h(-q) = -sum m (m/q) in the integers. (9) In Vinogradov's asymptotic formula r(N) is the
    sum of Lambda(k1) Lambda(k2) Lambda(k3) over k1 + k2 + k3 = N with every k >= 1; its constants, and the threshold
    of the three primes theorem, are not effective. (10) (since 0.4.0) Binary quadratic forms are triples (a, b, c)
    of integers; the basic theorem counts representations up to automorphs (Davenport counts primary
    representations) and holds without the condition (n, d) = 1. The Riemann-von Mangoldt formula is stated with the
    explicit error bound 3/T, for T > 0 not an ordinate of a zero, with S(T) defined as an integral of zeta'/zeta along
    Davenport's path. The explicit formula is stated as the limit, as T tends to infinity, of the sum over the zeros
    with |gamma| < T, for real x >= 2. (11) (since 0.5.0) Hecke's class number bound asks for the zero-free interval
    only for the character of the one field (Davenport: for every real primitive character); Montgomery's large sieve,
    stated without proof in the book, is proved by Montgomery's argument; the size of the exceptional modulus (row
    20-9, not a headline) is proved with log^4 q1 in general.

review:
  status: "not yet reviewed: the 48 headline statements of the Challenge_<book>.lean files and the definitions they use have not yet been reviewed by a human"
  reviewers: []
  notes: >-
    The headline statements and the definitions they use have not yet been reviewed by a human; that review is
    planned. The rest of the library has not been reviewed by a human, and there has been no external review. Lean
    checks the proofs; lake comparator checks, one book at a time, that each Solution_<book>.lean proves exactly
    the Challenge_<book>.lean statements using only the standard axioms.

